stage2_failure_debugging:
  completed_at: "2026-07-05 18:03"
  root_causes:
    - Reasoning models spent the response budget in `message.reasoning` and emitted empty `message.content`.
    - Qwen Plus and Max models require streaming responses.
    - Several models returned fenced, prefaced, or invalid JSON that still contained a legal action id.
    - The prior HTTP error path hid provider error details such as `streaming_required`.
  implemented_controls:
    - HTTP client `stream` support for server-sent event chat chunks.
    - HTTP client `reasoning_enabled` support for Together hybrid reasoning models.
    - Scorecard CLI `--stream` and `--disable-reasoning` flags.
    - Parser recovery for fenced JSON and verbatim legal action ids.
