shortlist:
  primary:
    model: openai/gpt-oss-20b
    reason: Lowest listed price among long-context chat models with documented function calling and structured outputs.
  qwen_candidate:
    model: Qwen/Qwen3.5-9B
    reason: Larger 262k context with documented function calling and structured outputs; not cheaper than the primary model.
  exploratory_low_cost:
    - model: LiquidAI/LFM2-24B-A2B
      reason: Lowest listed chat price, but only 32k context, no documented structured-output flag, and 1/3 press-light pass rate.
    - model: google/gemma-3n-E4B-it
      reason: Low output price, 32k context, no documented structured-output flag, and 2/3 press-light pass rate.
  short_context_caution:
    - model: meta-llama/Meta-Llama-3-8B-Instruct-Lite
      reason: Passed 3/3 press-light runs under the short 512-token cap, but still carries context risk for longer native Concordia prompts.
