bounded_smokes:
  direct_http:
    openai/gpt-oss-20b: pass
    Qwen/Qwen3.5-9B: pass
    LiquidAI/LFM2-24B-A2B: pass
    google/gemma-3n-E4B-it: pass
  native_concordia_one_turn:
    openai/gpt-oss-20b: pass
    Qwen/Qwen3.5-9B: pass
  smoke_note: Direct JSON smoke needs a 256-token completion cap for both primary candidates; lower caps can exhaust reasoning text before final content.
constraints:
  - Native Concordia prompts can exceed 8k tokens, so 8k-context models are not suitable for native runs.
  - The provider uses dynamic per-model rate limits, so calibration should be sequential with retry/backoff.
  - Low-cost overnight work needs explicit run bounds, token caps, and artifact validation before longer batches.
stage2_provider_gate:
  provider: together
  api_key_env: TOGETHER_API_KEY
  cost_cap_flag: --max-models-cost-usd
  note: The scorecard CLI can construct the existing Together HTTP provider client, but live calls still require runtime credentials and an explicit positive cost cap.
